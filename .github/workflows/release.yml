name: Release
on:
  push:
    tags:
      - v*

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_tag:
    if: github.repository == 'yomihon/yomihon'
    name: Extract tag name
    runs-on: 'ubuntu-24.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  prepare_models:
    if: github.repository == 'yomihon/yomihon'
    name: Prepare Models
    runs-on: ubuntu-24.04

    steps:
      - name: Download and Verify Models
        run: |
          # SHA256 hashes for file verification
          # Format: "owner/repo:remote_path:local_path:hash"
          FILES=(
            "bluolightning/manga-ocr-tflite:mocr_2025_decoder_float32.tflite:app/src/main/assets/ocr/decoder.tflite:b6f0b49e7537abc24de4d5e7f44c71c3e04b4f30a9dac6b5704db94c963ce31b"
            "bluolightning/manga-ocr-tflite:mocr_2025_encoder_fp32.tflite:app/src/main/assets/ocr/encoder.tflite:126441c11edb3f3c9da639647ba82d846872a7ad51d62cdbc50767fa5abf4f43"
            "bluolightning/manga-ocr-tflite:mocr_2025_embeddings_float32.bin:app/src/main/assets/ocr/embeddings.bin:ef1959fd6b2ed011b782722d975a67332b859ccc717688ad06a16d170145bc6c"
            "bluolightning/manga-ocr-mobile:v1_fp16/decoder.tflite:app/src/main/assets/ocr_fast/decoder.tflite:116db3f02364ceac91f86f46e54979d4fd7209e8d8820f3812410b0d732ee2b8"
            "bluolightning/manga-ocr-mobile:v1_fp16/encoder.tflite:app/src/main/assets/ocr_fast/encoder.tflite:d724e5682c874b98202d4ac8f3e84848cd9d06a5e27cb0dadb27ebaea1b35f47"
            "leoxs22/manga-panel-detector-yolo26n:manga_panel_detector_int8.tflite:data/src/main/assets/panel_detector/model.tflite:b1a7d8d4492e04a777ae0d3efd9dc1fbd6e8f361971eadb813279ce3dfd1b464"
          )

          for item in "${FILES[@]}"; do
            IFS=":" read -r REPO_PATH REMOTE_PATH LOCAL_PATH HASH <<< "$item"
            
            mkdir -p "$(dirname "$LOCAL_PATH")"
            
            echo "Downloading $REMOTE_PATH from $REPO_PATH as $LOCAL_PATH..."
            curl -L "https://huggingface.co/$REPO_PATH/resolve/main/$REMOTE_PATH" -o "$LOCAL_PATH"

            # Verification
            echo "$HASH  $LOCAL_PATH" | sha256sum -c - || { echo "Hash mismatch for $LOCAL_PATH"; exit 1; }
          done

      - name: Upload Models
        uses: actions/upload-artifact@v4
        with:
          name: ocr-models
          path: |
            app/src/main/assets/ocr/
            app/src/main/assets/ocr_fast/
            data/src/main/assets/panel_detector/

  build:
    if: github.repository == 'yomihon/yomihon'
    name: Build
    runs-on: 'ubuntu-24.04'
    needs: [get_tag, prepare_models]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Download Models
        uses: actions/download-artifact@v4
        with:
          name: ocr-models
          path: .

      - name: Build
        run: ./gradlew assembleRelease -Pinclude-telemetry -Penable-updater
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk yomihon-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk yomihon-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86-release.apk yomihon-x86-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk yomihon-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-universal-release.apk yomihon-universal-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yomihon
          path: |
            yomihon-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            yomihon-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            yomihon-x86-${{ needs.get_tag.outputs.tag }}.apk
            yomihon-x86_64-${{ needs.get_tag.outputs.tag }}.apk
            yomihon-universal-${{ needs.get_tag.outputs.tag }}.apk

  build_foss:
    if: github.repository == 'yomihon/yomihon'
    name: Build (FOSS)
    runs-on: ubuntu-24.04
    needs: [get_tag, prepare_models]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true

      - name: Download Models
        uses: actions/download-artifact@v4
        with:
          name: ocr-models
          path: .

      - name: Build
        run: ./gradlew assembleFoss -Penable-updater
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/foss/app-universal-foss.apk yomihon-${{ needs.get_tag.outputs.tag }}-foss.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yomihon-foss
          path: yomihon-${{ needs.get_tag.outputs.tag }}-foss.apk

  release:
    if: github.repository == 'yomihon/yomihon'
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [get_tag, build, build_foss]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: |
            yomihon
            yomihon-foss
            ocr-models

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Yomihon ${{ needs.get_tag.outputs.tag }}
          body: |
            Check out the [past release notes](https://github.com/yomihon/yomihon/releases) if you’re upgrading from an earlier version.

            <!-->



            <!-->

            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `yomihon-universal-${{ needs.get_tag.outputs.tag }}.apk`
          files: |
            yomihon-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            yomihon-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            yomihon-x86-${{ needs.get_tag.outputs.tag }}.apk
            yomihon-x86_64-${{ needs.get_tag.outputs.tag }}.apk
            yomihon-universal-${{ needs.get_tag.outputs.tag }}.apk
            yomihon-${{ needs.get_tag.outputs.tag }}-foss.apk
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
